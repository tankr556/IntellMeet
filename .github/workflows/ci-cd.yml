name: IntellMeet CI/CD Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install & Build Server
      run: |
        cd server
        npm install
        npm run build

    - name: Install & Build Client
      run: |
        cd client
        npm install
        npm run build

    - name: Build Docker Container Images
      run: |
        docker build -t intellmeet-server:latest ./server
        docker build -t intellmeet-client:latest ./client
