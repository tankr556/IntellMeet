version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: intellmeet-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: intellmeet-redis
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: intellmeet-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/intellmeet
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_access_jwt_key_2026
      - JWT_REFRESH_SECRET=super_secret_refresh_jwt_key_2026
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: intellmeet-client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data:
