apiVersion: v1
kind: Namespace
metadata:
  name: intellmeet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellmeet-server
  namespace: intellmeet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: intellmeet-server
  template:
    metadata:
      labels:
        app: intellmeet-server
    spec:
      containers:
      - name: server
        image: intellmeet-server:latest
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb:27017/intellmeet"
        - name: REDIS_URL
          value: "redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: intellmeet-server-service
  namespace: intellmeet
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: intellmeet-server
